# Redraws the skyline header every night from the last 12 months of contributions.
name: Redraw skyline

on:
  schedule:
    - cron: "17 12 * * *" # 12:17 UTC, around 1am in Auckland
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch contributions
        env:
          # SKYLINE_TOKEN is optional: only needed if the built-in token can't see private contributions.
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || github.token }}
        run: node scripts/skyline/fetch-calendar.mjs "${{ github.repository_owner }}" > "$RUNNER_TEMP/calendar.json"

      - name: Draw the skyline
        run: node scripts/skyline/skyline.mjs "$RUNNER_TEMP/calendar.json" assets

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No change tonight."
            exit 0
          fi
          git commit -m "Redraw skyline"
          git push
